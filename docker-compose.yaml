services:
  postgres:
    image: postgres:17-alpine
    container_name: open-webui-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB-open-webui}
      POSTGRES_USER: ${POSTGRES_USER-open-webui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-open-webui}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT-5432}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER-open-webui} -d ${POSTGRES_DB-open-webui}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'DATABASE_TYPE=postgresql'
      - 'DATABASE_HOST=postgres'
      - 'DATABASE_PORT=5432'
      - 'DATABASE_NAME=${POSTGRES_DB-open-webui}'
      - 'DATABASE_USER=${POSTGRES_USER-open-webui}'
      - 'DATABASE_PASSWORD=${POSTGRES_PASSWORD-open-webui}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
  postgres: {}
