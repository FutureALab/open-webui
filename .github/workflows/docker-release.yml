name: Build Docker Image and Publish Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0 的 tag 时自动触发
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发
    inputs:
      version:
        description: 'Release 版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要创建 Release 和上传附件的写入权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # 释放 GitHub Actions Runner 磁盘空间（Docker 镜像打包较大时非常重要）
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Build Docker image
        run: |
          echo "Building Docker image for version ${VERSION}..."
          docker build -t open-webui:${VERSION} .

      - name: Save Docker image to tar
        run: |
          echo "Saving Docker image to tar..."
          docker save open-webui:${VERSION} -o open-webui-${VERSION}.tar
          ls -lh open-webui-${VERSION}.tar

      - name: Create Release and Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 检查 release 是否已存在
          if gh release view "${VERSION}" &>/dev/null; then
            echo "Release ${VERSION} exists, uploading asset..."
            gh release upload "${VERSION}" open-webui-${VERSION}.tar --clobber
          else
            echo "Creating release ${VERSION} and uploading asset..."
            gh release create "${VERSION}" open-webui-${VERSION}.tar \
              --title "Release ${VERSION}" \
              --generate-notes
          fi
